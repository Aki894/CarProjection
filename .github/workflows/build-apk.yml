name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "keystore/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare stable debug signing key
        run: |
          base64 --decode keystore/carprojection-debug.keystore.b64 > keystore/carprojection-debug.keystore
          keytool -list -keystore keystore/carprojection-debug.keystore -storepass android -alias carprojectiondebug

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show build environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36.0.0" || true

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/CarProjection-debug.apk
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarProjection-debug-apk
          path: artifacts/CarProjection-debug.apk
          if-no-files-found: error
          retention-days: 14
