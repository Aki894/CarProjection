name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "keystore/**"
      - "tools/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare stable debug signing key
        run: |
          sed 's/\\n$//' keystore/carprojection-debug.keystore.b64 | base64 --decode > keystore/carprojection-debug.keystore
          keytool -list -keystore keystore/carprojection-debug.keystore -storepass android -alias carprojectiondebug

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show build environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36.0.0" || true

      - name: Check streaming audio conversion
        run: bash tools/check-audio.sh

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug :app:lintDebug \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/CarProjection-debug.apk
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarProjection-debug-apk
          path: artifacts/CarProjection-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarProjection-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  diplay-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: diplay
    steps:
      - name: Checkout CarProjection test signing configuration
        uses: actions/checkout@v4
        with:
          path: carprojection
      - name: Checkout paired DiPlay bridge source
        uses: actions/checkout@v4
        with:
          repository: Aki894/DiPlay
          ref: 65ef4fdd38f6d87ea13c115548da02003bc6ed71
          path: diplay
      - name: Reject credential files in source
        run: python3 scripts/check_public_tree.py
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up DiPlay Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare stable public test signing key
        run: |
          sed 's/\\n$//' ../carprojection/keystore/carprojection-debug.keystore.b64 | base64 --decode > "$RUNNER_TEMP/bridge-debug.keystore"
          echo "DIPLAY_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/bridge-debug.keystore" >> "$GITHUB_ENV"
      - name: Check DiPlay tests, lint and identity-free source build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --stacktrace
      - name: Provision selected upstream preview runtime authentication
        run: |
          curl --fail --location --retry 3 'https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.9/DiPlay-0.2.9.apk' -o "$RUNNER_TEMP/DiPlay-upstream.apk"
          python3 scripts/prepare_bridge_auth.py "$RUNNER_TEMP/DiPlay-upstream.apk" "$RUNNER_TEMP/diplay-runtime-assets"
      - name: Build standalone bridge test APK
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/diplay-runtime-assets
        run: ./gradlew :mobile:assembleStandaloneDebug :mobile:lintDebug --stacktrace
      - name: Verify APK runtime assets and record paired source
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/diplay-runtime-assets
        run: |
          python3 - <<'CHECK'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile('mobile/build/outputs/apk/debug/mobile-debug.apk') as apk:
              for name in ('identity.pk8', 'certificate.p7b'):
                  assert apk.read('assets/offline-mfi/' + name) == (Path(os.environ['DIPLAY_AUTH_ASSETS_DIR']) / 'offline-mfi' / name).read_bytes()
          print('Standalone runtime assets match explicitly selected inputs.')
          CHECK
          git rev-parse HEAD > bridge-source-commit.txt
      - name: Upload DiPlay bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-CarLife-bridge-apk
          path: |
            diplay/mobile/build/outputs/apk/debug/mobile-debug.apk
            diplay/bridge-source-commit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload DiPlay test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-bridge-checks
          path: |
            diplay/shared/build/reports/tests/
            diplay/common/build/reports/tests/
            diplay/mobile/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary runtime material
        if: always()
        run: rm -rf "$RUNNER_TEMP/diplay-runtime-assets" "$RUNNER_TEMP/DiPlay-upstream.apk" "$RUNNER_TEMP/bridge-debug.keystore"
