name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "plugin/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # New Android SDK command-line tools require a modern JDK.
      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-29" "build-tools;28.0.3"

      # This legacy project uses Gradle 4.10.1 + Android Gradle Plugin 3.3.2.
      # Switch back to Java 8 before invoking Gradle.
      - name: Set up JDK 8 for legacy Gradle build
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show build environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/CarProjection-debug.apk
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarProjection-debug-apk
          path: artifacts/CarProjection-debug.apk
          if-no-files-found: error
          retention-days: 14
