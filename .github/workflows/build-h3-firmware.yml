name: Build WuKongPi H3 development firmware
on:
  workflow_dispatch:
  push:
    paths:
      - firmware/wukongpi-h3/**
      - .github/workflows/build-h3-firmware.yml
permissions:
  contents: read
concurrency:
  group: h3-firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARMBIAN_SHA: b44a5a2cfc5114477e20fc8f6aaa38058860ab9f
    steps:
      - uses: actions/checkout@v4
      - name: Check firmware scripts
        run: |
          bash -n firmware/wukongpi-h3/userpatches/customize-image.sh
          bash -n firmware/wukongpi-h3/userpatches/config-carlife-h3.conf
          bash -n firmware/wukongpi-h3/userpatches/extensions/carlife-h3-tools.sh
          bash -n firmware/wukongpi-h3/userpatches/overlay/carlife-board-check
      - name: Check runner resources
        run: |
          # Disposable hosted runner only: firmware needs the disk occupied by SDKs.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
          free -h
          docker version
      - name: Checkout pinned Armbian builder
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: b44a5a2cfc5114477e20fc8f6aaa38058860ab9f
          path: armbian-build
      - name: Prepare H3 image customization
        run: |
          mkdir -p armbian-build/userpatches
          cp -a firmware/wukongpi-h3/userpatches/. armbian-build/userpatches/
          printf 'Project=CarProjection\nProjectCommit=%s\nArmbianCommit=%s\nBoard=orangepizero (WuKongPi H3 compatible)\nPurpose=Hardware bring-up; no Linux CarPlay bridge yet\n' "$GITHUB_SHA" "$ARMBIAN_SHA" > armbian-build/userpatches/overlay/carlife-firmware-info
      - name: Register ARM userspace emulator on the build host
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build minimal bootable TF image
        working-directory: armbian-build
        run: ./compile.sh carlife-h3 SHOW_LOG=yes SHARE_LOG=no
      - name: Collect image, checksums and build manifest
        run: |
          mkdir -p firmware-output
          find armbian-build/output/images -maxdepth 1 -type f \( -name '*.img.xz' -o -name '*.img.sha' -o -name '*.txt' \) -exec cp '{}' firmware-output/ \;
          test "$(find firmware-output -name '*.img.xz' | wc -l)" -eq 1
          cp firmware/wukongpi-h3/README.md firmware-output/README.md
          cp armbian-build/userpatches/overlay/carlife-firmware-info firmware-output/build-manifest.txt
          if test -d armbian-build/output/debs; then
            find armbian-build/output/debs -type f -name '*.deb' -printf '%f\n' >> firmware-output/build-manifest.txt
          fi
          cd firmware-output
          sha256sum -- *.img.xz > SHA256SUMS
          xz -t -- *.img.xz
      - name: Verify TF boot header and installed root filesystem
        run: |
          xz -dk firmware-output/*.img.xz
          image=$(find firmware-output -name '*.img' -print -quit)
          python3 - "$image" <<'PY'
          import sys
          with open(sys.argv[1], 'rb') as f:
              f.seek(8196)
              assert f.read(8) == b'eGON.BT0', 'Missing Allwinner SPL boot magic'
              f.seek(510)
              assert f.read(2) == b'\x55\xaa', 'Missing partition-table signature'
          PY
          loop=$(sudo losetup --find --show --partscan "$image")
          mkdir -p image-check
          trap 'sudo umount image-check 2>/dev/null || true; sudo losetup -d "$loop"; rm -f "$image"' EXIT
          sudo udevadm settle
          sudo mount -o ro "${loop}p1" image-check
          test -f image-check/boot/boot.scr
          test -f image-check/boot/armbianEnv.txt
          test -f image-check/etc/carlife-firmware-info
          test -x image-check/usr/local/sbin/carlife-board-check
          test -x image-check/usr/sbin/sshd
          find image-check/boot -name 'sun8i-h2-plus-orangepi-zero.dtb' | tee firmware-output/boot-validation.txt
          test -s firmware-output/boot-validation.txt
          sudo umount image-check
          sudo losetup -d "$loop"
          rm -f "$image"
          trap - EXIT
      - name: Upload bootable H3 image
        uses: actions/upload-artifact@v4
        with:
          name: WuKongPi-H3-development-image
          path: firmware-output/
          compression-level: 0
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WuKongPi-H3-build-logs
          path: armbian-build/output/logs/
          if-no-files-found: ignore
          retention-days: 7
