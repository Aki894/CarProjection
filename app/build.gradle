def fixedDebugKeystore = rootProject.file("keystore/carprojection-debug.keystore")

apply plugin: 'com.android.application'
apply plugin: 'com.google.protobuf'

android {
    namespace 'com.projection.car'
    compileSdk 36

    defaultConfig {
        applicationId "com.projection.car"
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "0.2.1"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        fixedDebug {
            storeFile fixedDebugKeystore
            storePassword "android"
            keyAlias "carprojectiondebug"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            if (fixedDebugKeystore.exists()) {
                signingConfig signingConfigs.fixedDebug
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDir 'src/main/java'
            }
            proto {
                srcDir 'src/main/proto'
                include '**/*.proto'
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.protobuf:protobuf-lite:3.0.1'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.0.0'
    }
    plugins {
        javalite {
            artifact = 'com.google.protobuf:protoc-gen-javalite:3.0.0'
        }
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.plugins {
                javalite {}
            }
        }
    }
}
